name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-and-setup:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Core tests without vendor dependencies
        run: swift test --package-path Packages/Core
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
        with:
          ruby-version: '3.3'
      - name: Setup dependencies
        run: |
          brew install xcodegen
          pip install -r scripts/requirements.txt
          bundle install --gemfile scripts/Gemfile
      - name: Setup and report tooling tests
        run: BUNDLE_GEMFILE=scripts/Gemfile bundle exec python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Inbox receiver tests
        run: python3 -m unittest discover -s Tools/MZInbox -p test_inbox.py -v
      - name: Build the macOS Inbox companion
        run: swift build --package-path Tools/MZInboxMac -c release
      - name: Generate sample projects
        working-directory: Samples
        run: xcodegen generate
      - name: Build local and device samples
        run: |
          xcodebuild -project Samples/MZFoundationSamples.xcodeproj -scheme FoundationLocal -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData/Local CODE_SIGNING_ALLOWED=NO build
          python3 scripts/audit_binary.py DerivedData/Local/Build/Products/Debug-iphonesimulator/FoundationLocal.app --local
          xcodebuild -project Samples/MZFoundationSamples.xcodeproj -scheme FoundationVisionLocal -destination 'generic/platform=visionOS Simulator' -derivedDataPath DerivedData/VisionLocal CODE_SIGNING_ALLOWED=NO build
          python3 scripts/audit_binary.py DerivedData/VisionLocal/Build/Products/Debug-xrsimulator/FoundationVisionLocal.app --local
          xcodebuild -project Samples/MZFoundationSamples.xcodeproj -scheme FoundationDevice -configuration Internal -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project Samples/MZFoundationSamples.xcodeproj -scheme FoundationVisionDevice -configuration Internal -destination 'generic/platform=visionOS' CODE_SIGNING_ALLOWED=NO build
      - name: Adapter, reporting and developer-access contracts
        run: |
          for scheme in FoundationAdapterTests FoundationReportingTests FoundationDeveloperTests; do
            xcodebuild -project Samples/MZFoundationSamples.xcodeproj -scheme "$scheme" -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -parallel-testing-enabled NO -collect-test-diagnostics never CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
          done
