name: MZFoundationSamples
options:
  minimumXcodeGenVersion: 2.44.0
configs:
  Debug: debug
  Internal: release
  Release: release
packages:
  MZAppFoundation:
    path: ..
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: 0.6.1
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGNING_ALLOWED: false
    ENABLE_USER_SCRIPT_SANDBOXING: false
targetTemplates:
  Base:
    type: application
    sources:
    - Sources
    info:
      path: Info/${target_name}.plist
      properties:
        CFBundleDisplayName: MZ Foundation
        CFBundleURLTypes:
        - CFBundleURLSchemes:
          - mzsample
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        FirebaseAutomaticScreenReportingEnabled: false
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_IDFV_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matteozajac.mzfoundation.${target_name}
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
        Internal:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MZ_INTERNAL
    postBuildScripts:
    - name: MZ Build Metadata
      script: python3 "$SRCROOT/../scripts/generate_build_metadata.py" --app-root "$SRCROOT" --foundation-root "$SRCROOT/.." --channel "$CONFIGURATION" --stamp-build-time --output "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MZFoundationBuildMetadata.plist"
      basedOnDependencyAnalysis: false
targets:
  FoundationMacLocal:
    templates:
    - Base
    platform: macOS
    deploymentTarget: '15.0'
    dependencies:
    - package: MZAppFoundation
      product: MZAppFoundation
    settings:
      base:
        SUPPORTED_PLATFORMS: macosx
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MZ_LOCAL
        ENABLE_USER_SCRIPT_SANDBOXING: false
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG MZ_LOCAL
        Internal:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MZ_INTERNAL MZ_LOCAL
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MZ_LOCAL
  FoundationLocal:
    templates:
    - Base
    platform: iOS
    deploymentTarget: '26.0'
    dependencies:
    - package: MZAppFoundation
      product: MZAppFoundation
    settings:
      base:
        SUPPORTED_PLATFORMS: iphonesimulator
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MZ_LOCAL
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG MZ_LOCAL
        Internal:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MZ_INTERNAL MZ_LOCAL
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MZ_LOCAL
    info:
      path: Info/FoundationLocal.plist
      properties:
        NSMicrophoneUsageDescription: Record a voice message when you choose to describe
          a bug.
  FoundationDevice:
    templates:
    - Base
    platform: iOS
    deploymentTarget: '26.0'
    dependencies:
    - package: MZAppFoundation
      product: MZAppFoundationFirebase
    settings:
      base:
        SUPPORTED_PLATFORMS: iphoneos
    info:
      path: Info/FoundationDevice.plist
      properties:
        NSMicrophoneUsageDescription: Record a voice message when you choose to describe
          a bug.
  FoundationVisionLocal:
    templates:
    - Base
    platform: visionOS
    deploymentTarget: '26.0'
    dependencies:
    - package: MZAppFoundation
      product: MZAppFoundation
    settings:
      base:
        SUPPORTED_PLATFORMS: xrsimulator
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MZ_LOCAL
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG MZ_LOCAL
        Internal:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MZ_INTERNAL MZ_LOCAL
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MZ_LOCAL
  FoundationVisionDevice:
    templates:
    - Base
    platform: visionOS
    deploymentTarget: '26.0'
    dependencies:
    - package: MZAppFoundation
      product: MZAppFoundationLive
    settings:
      base:
        SUPPORTED_PLATFORMS: xros
  FoundationUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '26.0'
    sources:
    - UITests
    dependencies:
    - target: FoundationLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matteozajac.mzfoundation.uitests
        GENERATE_INFOPLIST_FILE: true
  FoundationMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: '15.0'
    sources:
    - MacUITests
    dependencies:
    - target: FoundationMacLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matteozajac.mzfoundation.macuitests
        GENERATE_INFOPLIST_FILE: true
  FoundationVisionUITests:
    type: bundle.ui-testing
    platform: visionOS
    deploymentTarget: '26.0'
    sources:
    - path: UITests/LoggingUITests.swift
    dependencies:
    - target: FoundationVisionLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matteozajac.mzfoundation.visionuitests
  FoundationAdapterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '26.0'
    sources:
    - AdapterTests
    dependencies:
    - package: MZAppFoundation
      product: MZAppFoundationLive
    - package: MZAppFoundation
      product: MZAppFoundationFirebase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matteozajac.mzfoundation.adaptertests
  FoundationReportingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '26.0'
    sources:
    - ../Tests/ReportingTests
    dependencies:
    - package: MZAppFoundation
      product: MZAppFoundation
    - package: MZAppFoundation
      product: MZAppFoundationReporting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matteozajac.mzfoundation.reportingtests
  FoundationDeveloperTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '26.0'
    sources:
    - ../Tests/DeveloperTests
    dependencies:
    - target: FoundationLocal
    - package: MZAppFoundation
      product: MZAppFoundation
      link: false
    - package: MZAppFoundation
      product: MZAppFoundationReporting
      link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matteozajac.mzfoundation.developertests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FoundationLocal.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FoundationLocal
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  FoundationDeveloperTests:
    build:
      targets:
        FoundationDeveloperTests: all
    test:
      config: Debug
      targets:
      - FoundationDeveloperTests
  FoundationMacLocal:
    build:
      targets:
        FoundationMacLocal: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
      - FoundationMacUITests
  FoundationMacUITests:
    build:
      targets:
        FoundationMacUITests: all
    test:
      config: Debug
      targets:
      - FoundationMacUITests
  FoundationAdapterTests:
    build:
      targets:
        FoundationAdapterTests: all
    test:
      config: Debug
      targets:
      - FoundationAdapterTests
  FoundationLocal:
    build:
      targets:
        FoundationLocal: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
      - FoundationUITests
  FoundationDevice:
    build:
      targets:
        FoundationDevice: all
    run:
      config: Internal
  FoundationVisionLocal:
    build:
      targets:
        FoundationVisionLocal: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
      - FoundationVisionUITests
  FoundationVisionDevice:
    build:
      targets:
        FoundationVisionDevice: all
    run:
      config: Internal
  FoundationReportingTests:
    build:
      targets:
        FoundationReportingTests: all
    test:
      config: Debug
      targets:
      - FoundationReportingTests
